# ============================================================
#   SGuilds - Desarrollado por Sirius
#   Sistema de farmeo con recompensas por tiers
# ============================================================
#
#  ¿CÓMO FUNCIONA?
#  ───────────────
#  Cuando un jugador rompe un bloque listado en una categoría, y lo hace
#  en un mundo donde esa categoría está activa, sube su contador de esa
#  categoría. Al llegar al "umbral" del tier del bloque se lanza el dado
#  de recompensa y el contador vuelve a cero.
#
#  TODO es configurable desde aquí: los mundos, las categorías, qué
#  bloque pertenece a qué categoría y tier, los umbrales, los permisos,
#  las raridades y las recompensas.
#
#  NOTA: el conteo solo ocurre si el bloque se rompe DE VERDAD. Si una
#  protección (WorldGuard, claims, spawn protegido...) cancela la rotura,
#  el jugador puede ver el bloque desaparecer un instante en su pantalla,
#  pero no suma ni entrega recompensas.
#
# ============================================================


# ============================================================
# MUNDOS
#
#  mundos            → lista de mundos donde funciona el farmeo.
#  todos-los-mundos  → true ignora la lista y activa el sistema en
#                      todos los mundos del servidor.
#
#  Cada categoría puede sobrescribir esto con su propia lista
#  (ver más abajo, en la sección "categorias").
# ============================================================
todos-los-mundos: false
mundos:
  - cultivos


# ============================================================
# PERMISOS — Los nodos son configurables.
#
#  admin          → acceso a /sguilds reload|stats|reset
#  bypass         → salta cualquier bloqueo por tier. Viene vacio
#                   (desactivado). Ponle "sguilds.bypass" si quieres
#                   que el staff pueda romper cualquier tier.
#  vip            → acceso a los tiers con requiere-vip2: false
#  vip2           → acceso a todos los tiers
#  tier           → permiso por número de tier ({tier})
#                   Sirve para los tiers de TODAS las categorías.
#  categoria-tier → permiso por categoría + tier ({categoria}, {tier}).
#                   Déjalo vacío ("") si no lo quieres usar.
#                   Ejemplo: "farmeo.{categoria}.tier{tier}" permite dar
#                   acceso al tier 3 solo en minerales.
#
#  Cualquier nodo que dejes vacío ("") queda desactivado.
# ============================================================
permisos:
  admin: "sguilds.admin"
  bypass: ""
  vip: "farmeo.vip"
  vip2: "farmeo.vip2"
  tier: "farmeo.tier{tier}"
  categoria-tier: ""


# ============================================================
# MENSAJES
#
#  Soporta colores hex (<#RRGGBB>), códigos legacy (&a &l &r...) y
#  etiquetas MiniMessage (<gray>, <bold>...).
#  {prefijo} inserta el prefijo definido aquí abajo.
#  Un mensaje vacío ("") no se envía.
# ============================================================
mensajes:
  prefijo: "<#FF1493>&lSGuilds &8»&r"
  bloque-bloqueado: "<#FF1493>&lSakura &c⛔ Bloque bloqueado"
  requiere-vip2: "&7No tienes el rankup suficiente para romper este bloque."
  requiere-rango: "&7Mejora tu rango con &e/rankup &7para desbloquearlo."
  reload-ok: "{prefijo} &aConfiguración recargada correctamente."
  sin-permiso: "{prefijo} &cNo tienes permiso para ejecutar este comando."
  uso-comando: "{prefijo} &7Uso: &e/sguilds <reload|stats [jugador]|reset [jugador]>"
  jugador-no-encontrado: "{prefijo} &cJugador no encontrado."
  especifica-jugador: "{prefijo} &cEspecifica un jugador: &e/sguilds stats <jugador>"
  stats-titulo: "{prefijo} &7Stats de &f{player}"
  stats-linea: "&7  {categoria}: &f{valor}"
  reset-ok: "{prefijo} &aContadores de &f{player} &areseteados."


# ============================================================
# RECOMPENSAS — Cada raridad tiene una lista de opciones.
#  Al ganar se elige UNA opción al azar (todas con la misma
#  probabilidad). Puedes poner las que quieras: 1, 3, 10...
#
#  mensaje  → lo que recibe el jugador. Usa \n para varias líneas.
#  comandos → lista de comandos que ejecuta la consola.
#
#  Placeholders disponibles en mensajes y comandos:
#    {player}    → nombre del jugador
#    {categoria} → nombre de la categoría (Cultivos, Minerales...)
#    {tier}      → tier del bloque que completó el umbral
#    {raridad}   → id de la raridad que salió
#
#  Puedes crear las raridades que quieras: el id que pongas aquí
#  (comun, raro, mitico, evento...) es el que usarás en "tiers".
# ============================================================
recompensas:
  comun:
    opciones:
      - mensaje: "<#FF1493>&l✦ &fObtuviste un <#FFD700>&lOro Compacto&f!"
        comandos:
          - "mi give MATERIAL ORO_COMPACTO {player} 1 0 100 0 s"
      - mensaje: "<#FF1493>&l✦ &fObtuviste <#7CFC00>&l$500&f!"
        comandos:
          - "eco give {player} 500"
      - mensaje: "<#FF1493>&l✦ &fObtuviste un <#B0C4DE>&lFragmento Zen&f!"
        comandos:
          - "mi give MATERIAL FRAGMENTO_ZEN {player} 1 0 100 0 s"

  raro:
    opciones:
      - mensaje: "<#FF1493>&l✦✦ &fObtuviste un <#FFD700>&lOro Compacto&f!"
        comandos:
          - "mi give MATERIAL ORO_COMPACTO {player} 1 0 100 0 s"
      - mensaje: "<#FF1493>&l✦✦ &fObtuviste un <#B9F2FF>&lDiamante Compacto&f!"
        comandos:
          - "mi give MATERIAL DIAMANTE_COMPACTO {player} 1 0 100 0 s"
      - mensaje: "<#FF1493>&l✦✦ &fObtuviste un <#00A86B>&lFragmento de Jade&f!"
        comandos:
          - "mi give MATERIAL FRAGMENTO_JADE {player} 1 0 100 0 s"

  ultrararo:
    opciones:
      - mensaje: "<#FF1493>&l✦✦✦ &fObtuviste un <#B9F2FF>&lDiamante Compacto&f!"
        comandos:
          - "mi give MATERIAL DIAMANTE_COMPACTO {player} 1 0 100 0 s"
      - mensaje: "<#FF1493>&l✦✦✦ &fObtuviste <#7CFC00>&l$5.000&f!"
        comandos:
          - "eco give {player} 5000"
      - mensaje: "<#FF1493>&l✦✦✦ &fObtuviste un <#B9F2FF>&lFragmento de Cristal&f!"
        comandos:
          - "mi give MATERIAL FRAGMENTO_CRISTAL {player} 1 0 100 0 s"

  legendario:
    opciones:
      - mensaje: "<#FF1493>&l★ Tesoro legendario descubierto ★\n&fObtuviste un <#8B8B8B>&lNetherita Compacta&f!"
        comandos:
          - "mi give MATERIAL NETHERITA_COMPACTA {player} 1 0 100 0 s"
      - mensaje: "<#FF1493>&l★ Tesoro legendario descubierto ★\n&fObtuviste <#7CFC00>&l$25.000&f!"
        comandos:
          - "eco give {player} 25000"
      - mensaje: "<#FF1493>&l★ Tesoro legendario descubierto ★\n&fObtuviste un <#FFB7C5>&lFragmento de Loto&f!\n&7Los pétalos se aquietan a tu paso..."
        comandos:
          - "mi give MATERIAL FRAGMENTO_LOTO {player} 1 0 100 0 s"

  ultralegendario:
    opciones:
      - mensaje: "<#FF1493>&l✦ ★ Mito hecho realidad ★ ✦\n&fObtuviste un <#8B8B8B>&lNetherita Compacta&f!\n&7La luna te ha elegido..."
        comandos:
          - "mi give MATERIAL NETHERITA_COMPACTA {player} 1 0 100 0 s"
      - mensaje: "<#FF1493>&l✦ ★ Mito hecho realidad ★ ✦\n&fObtuviste <#7CFC00>&l$100.000&f!\n&7Los espíritus ancestrales te sonríen..."
        comandos:
          - "eco give {player} 100000"
      - mensaje: "<#FF1493>&l✦ ★ Mito hecho realidad ★ ✦\n&fObtuviste un <#FFD700>&lFragmento Ancestral&f!\n&7El universo te reconoce..."
        comandos:
          - "mi give MATERIAL FRAGMENTO_ANCESTRAL {player} 1 0 100 0 s"


# ============================================================
# TIERS — Umbrales, permisos y probabilidades por nivel.
#  Estos son los tiers GLOBALES. Cada categoría puede definir su
#  propia sección "tiers" para sobrescribir los que quiera.
#
#  umbral           → bloques a romper para tirar el dado
#  requiere-permiso → false = cualquiera puede romperlo (tier libre).
#                     Si no lo pones, el tier 0 es libre y el resto no.
#  requiere-vip2    → true  = solo vip2 o el permiso del tier
#                     false = el permiso vip normal también sirve
#
#  recompensas → raridades que pueden salir, evaluadas EN ORDEN.
#    raridad → id definido arriba en "recompensas"
#    chance  → probabilidad en % (0.0 - 100.0)
#
#  Ejemplo: tier 2 tiene Raro 3% y Común 10%.
#    → el dado cae en el 3% inicial  → recompensa Rara
#    → cae entre 3% y 13%            → recompensa Común
#    → cae por encima de 13%         → nada
# ============================================================
tiers:
  0:
    umbral: 64
    requiere-permiso: false
    requiere-vip2: false
    recompensas:
      - raridad: comun
        chance: 15.0
  1:
    umbral: 64
    requiere-vip2: false
    recompensas:
      - raridad: comun
        chance: 12.0
  2:
    umbral: 64
    requiere-vip2: false
    recompensas:
      - raridad: raro
        chance: 3.0
      - raridad: comun
        chance: 10.0
  3:
    umbral: 64
    requiere-vip2: false
    recompensas:
      - raridad: raro
        chance: 5.0
      - raridad: comun
        chance: 8.0
  4:
    umbral: 64
    requiere-vip2: false
    recompensas:
      - raridad: ultrararo
        chance: 2.0
      - raridad: raro
        chance: 6.0
  5:
    umbral: 64
    requiere-vip2: false
    recompensas:
      - raridad: ultrararo
        chance: 3.0
      - raridad: raro
        chance: 4.0
  6:
    umbral: 64
    requiere-vip2: false
    recompensas:
      - raridad: legendario
        chance: 1.0
      - raridad: ultrararo
        chance: 3.0
  7:
    umbral: 64
    requiere-vip2: true
    recompensas:
      - raridad: legendario
        chance: 2.0
      - raridad: ultrararo
        chance: 2.0
  8:
    umbral: 32
    requiere-vip2: true
    recompensas:
      - raridad: ultralegendario
        chance: 1.0
      - raridad: legendario
        chance: 2.0
  9:
    umbral: 32
    requiere-vip2: true
    recompensas:
      - raridad: ultralegendario
        chance: 1.0
      - raridad: legendario
        chance: 1.5
  10:
    umbral: 32
    requiere-vip2: true
    recompensas:
      - raridad: ultralegendario
        chance: 1.0
      - raridad: legendario
        chance: 1.0
  11:
    umbral: 32
    requiere-vip2: true
    recompensas:
      - raridad: ultralegendario
        chance: 1.0
      - raridad: legendario
        chance: 1.0


# ============================================================
# CATEGORÍAS — Cada categoría tiene su propio contador.
#
#  Puedes crear las que quieras (peces, mobs, cristales...).
#  El id de la categoría es la clave (cultivos, minerales...).
#
#  nombre            → nombre visible en /sguilds stats
#  activada          → false la desactiva sin borrarla
#  mundos            → lista propia de mundos. Si no la pones, usa
#                      la lista global de arriba.
#  todos-los-mundos  → true activa la categoría en todos los mundos
#  mensaje-bloqueado → mensaje al romper un bloque sin permiso.
#                      Si no lo pones, usa mensajes.bloque-bloqueado
#  tiers             → sobrescribe tiers globales solo para esta
#                      categoría (opcional, mismo formato de arriba)
#  bloques           → tier: [lista de materiales]
#                      Un material puede repetirse en varias
#                      categorías si están en mundos distintos.
# ============================================================
categorias:

  cultivos:
    nombre: "Cultivos"
    activada: true
    # Sin "mundos" propios, esta categoria usa la lista global de arriba.
    # Descomenta para darle mundos exclusivos:
    # mundos:
    #   - cultivos
    mensaje-bloqueado: "<#FF1493>&lSakura &c⛔ Bloque bloqueado"
    bloques:
      0: [WHEAT]
      1: [CARROTS]
      2: [POTATOES]
      3: [BEETROOTS]
      4: [PUMPKIN]
      5: [MELON]
      6: [NETHER_WART]
      7: [COCOA]
      8: [SUGAR_CANE]
      9: [CACTUS]
      10: [BAMBOO, KELP, KELP_PLANT, SWEET_BERRY_BUSH, BROWN_MUSHROOM, RED_MUSHROOM]

  minerales:
    nombre: "Minerales"
    activada: true
    # Sin "mundos" propios, esta categoria usa la lista global de arriba.
    # Descomenta para darle mundos exclusivos:
    # mundos:
    #   - minas
    mensaje-bloqueado: "<#FF1493>&lSakura &c⛔ Bloque bloqueado"
    bloques:
      0: [COAL_ORE, DEEPSLATE_COAL_ORE, COAL_BLOCK]
      1: [COPPER_ORE, DEEPSLATE_COPPER_ORE, COPPER_BLOCK]
      2: [IRON_ORE, DEEPSLATE_IRON_ORE, IRON_BLOCK]
      3: [NETHER_QUARTZ_ORE]
      4: [GOLD_ORE, DEEPSLATE_GOLD_ORE, NETHER_GOLD_ORE, GOLD_BLOCK]
      5: [REDSTONE_ORE, DEEPSLATE_REDSTONE_ORE, REDSTONE_BLOCK]
      6: [LAPIS_ORE, DEEPSLATE_LAPIS_ORE, LAPIS_BLOCK]
      7: [AMETHYST_CLUSTER, AMETHYST_BLOCK]
      8: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE, DIAMOND_BLOCK]
      9: [EMERALD_ORE, DEEPSLATE_EMERALD_ORE, EMERALD_BLOCK]
      10: [ANCIENT_DEBRIS, NETHERITE_BLOCK]

  maderas:
    nombre: "Maderas"
    activada: true
    # Sin "mundos" propios, esta categoria usa la lista global de arriba.
    # Descomenta para darle mundos exclusivos:
    # mundos:
    #   - bosque
    mensaje-bloqueado: "<#FF1493>&lSakura &c⛔ Bloque bloqueado"
    bloques:
      0: [OAK_LOG]
      1: [SPRUCE_LOG]
      2: [BIRCH_LOG]
      3: [JUNGLE_LOG]
      4: [ACACIA_LOG]
      5: [DARK_OAK_LOG]
      6: [MANGROVE_LOG]
      7: [CHERRY_LOG]
      8: [CRIMSON_STEM]
      9: [WARPED_STEM]
